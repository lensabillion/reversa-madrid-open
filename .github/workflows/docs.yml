name: Docs and scripts

on:
  pull_request:
  push:
    branches: [main]

# Read-only token: these jobs only check files.
permissions:
  contents: read

jobs:
  scripts:
    name: Repository scripts pass Ruff
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      # Actions are pinned to full commit SHAs: a tag can be moved to other code, a SHA cannot.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.8"
          enable-cache: false
      - run: make check-scripts

  catalogs:
    name: Research catalogs are valid
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: "0.12.8"
          enable-cache: false
      - run: make check-docs
