  <rect x="44" y="100" width="480" height="94" rx="6" class="node"/>
  <text x="62" y="130" class="node-label">Parltrack · Transparency Register</text>
  <text x="62" y="159" class="small">Procedures, amendments, MEPs · organisations</text>
  <text x="62" y="181" class="small">Have Your Say consultation index</text>
  <rect x="670" y="100" width="480" height="94" rx="6" class="node"/>
  <text x="688" y="130" class="node-label">CELLAR / EUR-Lex · Have Your Say</text>
  <text x="688" y="161" class="small">Proposal + final act · consultation documents</text>

  <rect x="24" y="246" width="1152" height="424" rx="8" class="boundary"/>
  <text x="1152" y="276" text-anchor="end" class="boundary-label">OFFLINE GENERATION · Python CLI</text>
  <path d="M140 194V312" class="data"/>
  <text x="158" y="239" class="small">downloads + index</text>
  <path d="M700 194V228H648V312" class="data"/>
