<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" style="max-width:100%;height:auto" role="img" aria-labelledby="title description">
  <title id="title">influence technical architecture</title>
  <desc id="description">Public source data enters an offline Python pipeline. Setup downloads Parltrack and Transparency Register records and builds the Have Your Say index into global inputs. Collect reads these inputs, fetches CELLAR and EUR-Lex law texts and Have Your Say consultation documents, and writes per-law JSONL records and a provenance and coverage manifest. Lineage reads the bundle, traces lexical adoption and consultation origins, and writes lineage.json using schema lineage-2 with exact lexical carrier supports. Legacy lineage-1 snapshots remain readable without fabricated evidence. Optional BM25 shortlisting, an external Jev judge, a spend cap and a request-keyed cache add reworded consultation origins only. Final adoption remains lexical. FastAPI validates saved views; Next.js proxies browser GET requests; JSON responses and ETags return to the lineage browser. HTTP reads never collect or call models. Independent quality review reads the snapshot and exports a seeded adopted-phrase sample. Those rows and separately stored human labels produce a review summary with agreement and Wilson intervals. Human labels never write back to production, and this review's population differs from graph links. Shared wording and model judgments do not establish authorship or causal influence.</desc>
  <defs>
    <marker id="data-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#147d78" stroke-width="1.5"/></marker>
    <marker id="request-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#63758c" stroke-width="1.5"/></marker>
    <marker id="optional-arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto-start-reverse"><path d="M1 1L7 4L1 7" fill="none" stroke="#8055ad" stroke-width="1.5"/></marker>
    <style>
      text { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif; fill: #233247; }
      .heading { font-size: 26px; font-weight: 650; }
      .boundary-label { font-size: 20px; font-weight: 650; letter-spacing: 1px; }
      .node-label { font-size: 23px; font-weight: 600; }
      .body { font-size: 20px; fill: #526174; }
      .small { font-size: 20px; fill: #526174; }
      .mono { font-family: 'SFMono-Regular', Consolas, 'Liberation Mono', monospace; font-size: 20px; fill: #405268; }
      .boundary { fill: #f8fafc; stroke: #d7dfe8; stroke-width: 1.5; }
      .node { fill: white; stroke: #bccbd8; stroke-width: 1.5; }
      .store { fill: #edf7f6; stroke: #62a49f; stroke-width: 1.5; }
      .data { fill: none; stroke: #147d78; stroke-width: 2.5; stroke-linejoin: round; marker-end: url(#data-arrow); }
      .request { fill: none; stroke: #63758c; stroke-width: 2; stroke-dasharray: 5 4; marker-end: url(#request-arrow); }
      .optional { fill: none; stroke: #8055ad; stroke-width: 2; stroke-dasharray: 6 5; marker-end: url(#optional-arrow); }
      .cache-use { fill: none; stroke: #99a9ba; stroke-width: 1.5; }
    </style>
  </defs>
  <rect width="1200" height="1200" fill="white"/>
  <text x="24" y="34" class="heading">influence / technical architecture</text>

