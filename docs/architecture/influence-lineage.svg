  <rect x="44" y="320" width="190" height="110" rx="6" class="node"/>
  <text x="62" y="354" class="node-label">setup</text>
  <text x="62" y="386" class="mono">make setup</text>
  <text x="62" y="414" class="small">Global preparation</text>
  <path d="M242 374H272" class="data"/>
  <text x="255" y="358" text-anchor="middle" class="small">write</text>

  <path d="M280 335V411C280 436 480 436 480 411V335Z" class="store"/>
  <ellipse cx="380" cy="335" rx="100" ry="15" class="store"/>
  <text x="380" y="373" text-anchor="middle" class="node-label">Global inputs</text>
  <text x="380" y="402" text-anchor="middle" class="mono">raw/ + catalog/</text>
  <path d="M488 374H530" class="data"/>
  <text x="510" y="358" text-anchor="middle" class="small">read</text>

  <rect x="538" y="320" width="228" height="110" rx="6" class="node"/>
  <text x="556" y="354" class="node-label">collect</text>
  <text x="556" y="385" class="body">Resolve · extract</text>
  <text x="556" y="413" class="small">Actor resolution</text>
  <path d="M774 374H836" class="data"/>
  <text x="805" y="358" text-anchor="middle" class="small">write</text>

  <path d="M844 335V411C844 436 1144 436 1144 411V335Z" class="store"/>
  <ellipse cx="994" cy="335" rx="150" ry="15" class="store"/>
  <text x="994" y="369" text-anchor="middle" class="node-label">Per-law bundle</text>
  <text x="994" y="394" text-anchor="middle" class="mono">JSONL + manifest.json</text>
  <text x="994" y="417" text-anchor="middle" class="small">Provenance + coverage</text>

  <path d="M140 430V456M648 430V446H420V456" class="cache-use"/>
  <rect x="44" y="456" width="430" height="32" rx="5" fill="#eff3f7" stroke="#cad5df"/>
  <text x="62" y="478" class="small">HTTP response cache · data/cache/</text>
  <path d="M994 436V480H648V504" class="data"/>
  <text x="880" y="474" class="small">read bundle</text>

  <rect x="538" y="512" width="228" height="122" rx="6" class="node"/>
  <text x="556" y="544" class="node-label">lineage</text>
  <text x="556" y="576" class="body">Lexical adoption</text>
  <text x="556" y="605" class="body">Consultation origins</text>
  <path d="M774 573H836" class="data"/>
  <text x="804" y="557" text-anchor="middle" class="small">write</text>

  <path d="M844 527V611C844 636 1144 636 1144 611V527Z" class="store"/>
  <ellipse cx="994" cy="527" rx="150" ry="15" class="store"/>
  <text x="994" y="563" text-anchor="middle" class="node-label">lineage.json</text>
  <text x="994" y="592" text-anchor="middle" class="mono">data/laws/&lt;slug&gt;/</text>
  <text x="994" y="617" text-anchor="middle" class="small">Evidence · coverage · limits</text>

  <rect x="44" y="512" width="430" height="122" rx="6" fill="#f7f3fc" stroke="#a688c5" stroke-width="1.5" stroke-dasharray="6 5"/>
  <text x="62" y="544" class="node-label" style="fill:#6d4895">Optional origins · --jev</text>
  <text x="62" y="573" class="body" style="fill:#6d4895">BM25 shortlist → Jev (external)</text>
  <text x="62" y="598" class="small">Request-keyed cache · spend cap</text>
  <text x="62" y="621" class="mono">data/cache/jev/</text>
  <path d="M530 558H482" class="optional"/>
  <path d="M482 604H530" class="optional"/>
  <text x="44" y="655" class="small">make lineage = collect + lineage · setup is a prerequisite · paths are under data/</text>

  <!-- Dashed arrows are requests; solid arrows are returned data. -->
  <rect x="24" y="704" width="1152" height="225" rx="8" class="boundary"/>
  <text x="44" y="736" class="boundary-label">READ-ONLY WEB APPLICATION</text>
  <path d="M550 730H590" class="request"/>
  <text x="602" y="736" class="small">GET</text>
  <path d="M720 730H680" class="data"/>
  <text x="732" y="736" class="small">JSON / ETag</text>
  <path d="M994 634V777" class="data"/>
  <text x="1010" y="694" class="small">read snapshot</text>

  <rect x="44" y="785" width="430" height="110" rx="6" class="node"/>
  <text x="62" y="816" class="node-label">/lineage browser</text>
  <text x="62" y="846" class="body">Graph · counts · evidence</text>
  <text x="62" y="875" class="small">Client-side aggregation</text>
  <rect x="538" y="785" width="228" height="110" rx="6" class="node"/>
  <text x="556" y="816" class="node-label">Next.js</text>
  <text x="556" y="846" class="body">Same-origin proxy</text>
  <text x="556" y="875" class="mono">/api/v1/*</text>
  <rect x="844" y="785" width="300" height="110" rx="6" class="node"/>
  <text x="862" y="816" class="node-label">FastAPI</text>
  <text x="862" y="846" class="mono">/api/v1/lineage</text>
  <text x="862" y="875" class="mono">/{slug} · list + detail</text>
  <path d="M482 815H530" class="request"/>
  <path d="M774 815H836" class="request"/>
  <path d="M836 865H774" class="data"/>
  <path d="M530 865H482" class="data"/>
  <text x="44" y="918" class="small">Validated file reads only · browser GET never runs collection or calls Jev</text>

  <!-- Independent QA consumes a snapshot; no edge returns to production. -->
  <rect x="24" y="959" width="1152" height="171" rx="8" fill="white" stroke="#bdc8d4" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="44" y="989" class="boundary-label">INDEPENDENT QA · outside production</text>
  <rect x="44" y="1012" width="430" height="78" rx="6" class="node"/>
  <text x="62" y="1041" class="node-label">Seeded adopted-phrase review</text>
  <text x="62" y="1069" class="small">Reads lineage.json · exports rows</text>
  <rect x="538" y="1012" width="228" height="78" rx="6" class="node"/>
  <text x="556" y="1041" class="node-label">Human labels</text>
  <text x="556" y="1069" class="small">Separate JSONL</text>
  <rect x="844" y="1012" width="300" height="78" rx="6" class="node"/>
  <text x="862" y="1041" class="node-label">Review summary</text>
  <text x="862" y="1069" class="small">Agreement + Wilson interval</text>
  <path d="M774 1051H836" class="data"/>
  <path d="M474 1051H500V1107H994V1098" class="data"/>
  <text x="710" y="1123" text-anchor="middle" class="small">exported rows</text>

  <text x="600" y="1160" text-anchor="middle" class="small">Experimental associations · shared wording is not proof of authorship or causal influence.</text>
  <text x="600" y="1187" text-anchor="middle" class="small">Review samples phrases, not graph links; human labels never feed the website.</text>
</svg>
