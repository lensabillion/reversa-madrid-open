$schema: https://json-schema.org/draft/2020-12/schema
title: ExistingSystemCatalog
description: >-
  Systems and studies that trace legislative text back to its authors or measure lobby
  success: how each works, how it fails, and what we take from it. Consumers: the
  Challenge 03 explainer ("why existing systems fail") and the architecture decision.
type: object
required: [updated, systems]
properties:
  updated:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  systems:
    type: array
    items:
      $ref: '#/$defs/System'
$defs:
  System:
    type: object
    required: [id, name, year, kind, scope, url, method, results, failure_modes, lesson, status]
    properties:
      id:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      name:
        type: string
      builder:
        type: string
      year:
        type: integer
        minimum: 1990
        maximum: 2030
      kind:
        type: string
        enum: [tool, paper, journalism, ngo-analysis, method, product]
      scope:
        description: Legislature and texts compared.
        type: string
      url:
        type: string
        pattern: '^https?://'
      method:
        description: How it decides that one text came from another.
        type: string
      results:
        type: string
      failure_modes:
        type: array
        minItems: 1
        items:
          type: string
      lesson:
        description: What our design takes from it, or avoids.
        type: string
      status:
        description: >-
          verified = primary page fetched on 2026-10-02; measured = we reproduced its
          behaviour on data; reported = known from a search summary or citation only.
        type: string
        enum: [verified, measured, reported]
