$schema: https://json-schema.org/draft/2020-12/schema
title: FactCatalog
description: >-
  Factual claims used to explain Challenge 03 (EU law-making, lobbying, real cases,
  scoring, measurements). One record per claim. Consumers: the Challenge 03 explainer
  and the demo script, which must only state claims recorded here.
type: object
required: [updated, facts]
properties:
  updated:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  facts:
    type: array
    items:
      $ref: '#/$defs/Fact'
$defs:
  Fact:
    type: object
    required: [id, topic, claim, source, source_kind, status]
    properties:
      id:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      topic:
        type: string
        enum: [eu-process, lobbying, case, scoring, data, measurement, tool]
      claim:
        description: The claim in plain words, with numbers where available.
        type: string
      source:
        description: URL, or a repository path for our own measurements.
        type: string
      source_kind:
        type: string
        enum: [official, journalism, ngo, paper, vendor-docs, dataset, measured]
      status:
        description: >-
          verified = source fetched and the claim checked against it on the given date;
          measured = computed by us from public data; reported = taken from a search
          summary or secondary source without reading the primary page.
        type: string
        enum: [verified, measured, reported]
      checked:
        type: string
        pattern: '^\d{4}-\d{2}-\d{2}$'
      note:
        type: string
