softschema:
  contract: reversa.research:DatasetCatalog/v1
  schema: datasets.schema.yaml
  status: permissive
updated: '2026-10-02'
datasets:
  # Official EU and civic-tech sources: votes, adopted texts, consultations, meetings
  - id: aia-four-column-mandates
    name: AI Act four-column document (Commission proposal | EP mandate | Council mandate |
      draft agreement), 20 June 2023, and later trilogue texts
    url: https://artificialintelligenceact.eu/wp-content/uploads/2023/08/AI-Mandates-20-June-2023.pdf
    provider: artificialintelligenceact.eu (Future of Life Institute), hosting a leaked or shared
      EU working document
    year: 2023
    kind: corpus
    access: download
    licence: unknown
    scope: AI Act 2021/0106(COD) only. The same documents page also links AIA-Trilogue-Coreper.pdf
      and AIA-Trilogue-Committee.pdf (Feb 2024), the CZ general approach (Nov 2022) and the
      FR consolidated version (Jun 2022).
    contents: '681-page PDF table with numbered rows: Commission Proposal | EP Mandate | Council
      Mandate | Draft Agreement. The draft-agreement column is sparse at this date.'
    labels: row-aligned positions of the three institutions. This is the ground truth for which
      institution's wording won when compared with the final act.
    steps: [won, match]
    fit: high
    fit_reason: Row alignment removes the hardest matching step for the 'won' test on the AI
      Act.
    status: verified
    checked: '2026-10-02'
    evidence: Downloaded the 4.99 MB PDF (681 pages) and extracted page text from compressed
      streams, which shows the column headers and row numbers. Other file links were seen on
      https://artificialintelligenceact.eu/documents/ but not downloaded.
    caveats: Not an official publication. The licence is unclear. No equivalent was found for
      GDPR, DSA, DMA or the Data Act. Text extraction needs a proper PDF table parser.
  - id: cellar-ep-first-reading-texts
    name: CELLAR / EUR-Lex texts of the Parliament's first-reading positions and adopted amendments
      (CELEX 5yyyyAPnnnn)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:52023AP0236
    provider: Publications Office of the EU (CELLAR)
    year: 2026
    kind: corpus
    access: api
    licence: EUR-Lex reuse (Commission Decision 2011/833/EU), not re-checked
    scope: GDPR 52014AP0212 (P7_TA(2014)0212, consolidated EP position of 12 Mar 2014, OJ C
      378 9.11.2017). AI Act 52023AP0236 (amendments of 14 Jun 2023, OJ C/2024/506) and 52024AP0138
      (legislative resolution of 13 Mar 2024). DSA 52022AP0014 (20 Jan 2022). DMA 52021AP0499
      (15 Dec 2021). Data Act 52023AP0069 (14 Mar 2023).
    contents: 'Full text as XHTML. AI Act: 771 numbered amendments in ''Text proposed by the
      Commission | Amendment'' format, for example ''Amendment 1 Proposal for a regulation Citation
      4 a (new)''. DSA has about 660 ''Amendment N'' markers and DMA about 304. The GDPR text
      is the consolidated ''Position of the European Parliament adopted at first reading'' (331
      K chars), not in amendment format. 52024AP0138 returns only a 3.4 K-char stub in XHTML.'
    labels: final text (Parliament's adopted position), used to measure whether amendments 'won'
      between EP and final act
    steps: [won, passed, match]
    fit: high
    fit_reason: Official text of what Parliament adopted, keyed by amendment number for the
      AI Act, DSA and DMA. It aligns with committee report and plenary amendment numbers, and
      can be diffed against the final act.
    status: verified
    checked: '2026-10-02'
    evidence: 'GET with Accept: application/xhtml+xml returned HTTP 200 for all 6 CELEX ids
      (14 KB to 2.7 MB). Read the titles and counted amendment markers. Samples are in cellar/.'
    caveats: 'Use the CELLAR URI over plain http (http://publications.europa.eu/resource/celex/<CELEX>),
      because the https form returned 400 and eur-lex.europa.eu blocks scripts. Formats differ:
      GDPR is consolidated, the AI Act, DSA and DMA are in amendment format, and the Data Act
      had only 1 ''Amendment N'' marker, so check its structure. The consolidated AI Act position
      of 13 Mar 2024 (52024AP0138) is not in XHTML (PDF or corrigendum not checked). Amendment
      numbers in TA texts follow the plenary renumbering.'
  - id: cellar-final-acts-and-proposals
    name: CELLAR final acts (CELEX 3yyyyRnnnn) and Commission proposals (5yyyyPCnnnn)
    url: https://eur-lex.europa.eu/legal-content/EN/TXT/?uri=CELEX:32024R1689
    provider: Publications Office of the EU (CELLAR)
    year: 2026
    kind: corpus
    access: api
    licence: EUR-Lex reuse (Commission Decision 2011/833/EU), not re-checked
    scope: 'Final acts: GDPR 32016R0679, DMA 32022R1925, DSA 32022R2065, Data Act 32023R2854,
      AI Act 32024R1689. Proposals: 52012PC0011, 52020PC0825, 52020PC0842, 52021PC0206, 52022PC0068.'
    contents: 'Final acts are OJ XHTML (518 KB to 1.26 MB). Proposals are served as PDF items:
      for 52021PC0206, the 300 Multiple-Choice response lists DOC_1 ''1_EN_ACT_part1_v7.pdf''
      and DOC_2 (annexes). XML notices are available with Accept: application/xml;notice=branch.'
    labels: final text
    steps: [won, match]
    fit: high
    fit_reason: The endpoint of the 'won' measure (EP or stakeholder text -> final law) and
      the baseline (Commission proposal).
    status: verified
    checked: '2026-10-02'
    evidence: 5 final acts returned HTTP 200 as XHTML with OJ titles checked. Proposals returned
      400 for XHTML, 300 for PDF (listing read) and 200 for the XML notice.
    caveats: Use the CELLAR URI over plain http (http://publications.europa.eu/resource/celex/<CELEX>),
      because https returned 400. Proposals have no XHTML and need PDF or DOC extraction. The
      AI Act proposal text is also attached in Have Your Say.
  - id: ep-plenary-results-of-votes-xml
    name: European Parliament plenary minutes annex "Results of votes" (PV-...-VOT) in XML
    url: https://data.europarl.europa.eu/api/v2/plenary-session-documents/PV-9-2023-06-14-VOT?format=application%2Fld%2Bjson
    provider: European Parliament (Open Data Portal)
    year: 2026
    kind: api
    access: api
    licence: unknown
    scope: Every plenary sitting with votes. XML found for 2009-03-12, the 2014-03-12 GDPR vote,
      the 2021-12-15 DMA vote, the 2022-01-20 DSA vote, the 2023-03-14 Data Act vote and the
      2023-06-14 AI Act vote.
    contents: 'One table per report listing every amendment put to the vote: subject (article
      or recital), Am No, Author (committee, political group, ''MEPs'', or the committee giving
      an opinion such as ''LIBE committee''), method (RCV, EV, show of hands, split or separate
      vote) and outcome (''+'' adopted, ''-'' rejected, ''↓'' lapsed), with tallies for roll-call
      and electronic votes. The AI Act table lists the block vote on committee amendments 1-771
      and individual amendments 774, 792, 775, 804, 772, 773, 229D, 777 and others. Files are
      about 90-260 KB per sitting.'
    labels: plenary amendment vote outcome (adopted, rejected or lapsed) with author. This includes
      votes taken without roll call.
    steps: [passed, won, graph]
    fit: high
    fit_reason: The only official source that gives the outcome of every plenary amendment,
      including show-of-hands votes, with amendment numbers and authors. It closes the gap left
      by roll-call-only data.
    status: verified
    checked: '2026-10-02'
    evidence: Fetched API metadata for 5 sittings. Downloaded https://data.europarl.europa.eu/distribution/doc/PV-9-2023-06-14-VOT-FNL_en.xml
      (92,593 bytes) and PV-7-2014-03-12-VOT and PV-9-2022-01-20-VOT XML, and parsed the AI
      Act, GDPR and DSA tables.
    caveats: GDPR plenary 2014-03-12 was a 'single vote' (621-10-22) with no individual amendment
      votes. For GDPR, use the committee-stage inclusion test instead. The XML is presentation
      markup (TABLE, TR, TD) and needs a parser for merged cells and split votes. The file path
      is under distribution/doc/ and must be read from the API metadata, because guessed paths
      return 404. The licence was not checked.
  - id: howtheyvote-plenary-rollcalls
    name: HowTheyVote.eu weekly data export (plenary roll-call votes, amendment authors and
      amendment URLs)
    url: https://github.com/HowTheyVote/data/releases/latest
    provider: HowTheyVote.eu (civic tech)
    year: 2026
    kind: dataset
    access: download
    licence: open licence; terms at https://howtheyvote.eu/about#license (exact licence name
      not checked)
    scope: European Parliament plenary roll-call votes from 2019-07-15 to 2026-09-17 (9th and
      10th terms). Includes AI Act (2021/0106(COD)), DSA (2020/0361(COD)), DMA (2020/0374(COD))
      and Data Act (2022/0047(COD)). GDPR 2014 is not covered.
    contents: 'votes.csv: 25,204 votes with procedure_reference, description (for example ''Article
      5, § 1, après le point d - Am 772''), count_for/against/abstention/did_not_vote and texts_adopted_reference.
      The result field is filled for 7,613 votes from 2024 on (3,562 ADOPTED, 4,051 REJECTED).
      amendment_number is filled for 6,624 votes from 2024 on. member_votes.csv.gz (68.5 MB)
      holds MEP x vote positions. amendment_authors_votes.csv: 6,999 rows (GROUP 4,489, ORIGINAL_TEXT
      1,710, COMMITTEE 453, MEMBERS 342) from 2024 on. amendment_urls.csv: 4,613 rows linking
      vote_id and amendment_number to EP amendment PDFs. Coverage: AI Act 30 votes (28 on 2023-06-14
      including amendments 774, 792, 804 and 772), DSA 126, DMA 39, Data Act 10.'
    labels: plenary amendment vote outcome. From 2024 there is an explicit result field. Before
      2024 the outcome comes from comparing count_for and count_against, and the amendment number
      comes from parsing description.
    steps: [passed, graph, predict, demo]
    fit: high
    fit_reason: Ready-made CSV of plenary amendment votes with amendment numbers, tallies and
      per-MEP positions for the AI Act, DSA, DMA and Data Act. It links to Parltrack ep_plenary_amendments
      by report reference and amendment number.
    status: verified
    checked: '2026-10-02'
    evidence: Downloaded votes, amendment_authors_votes, amendment_urls and responsible_committee_votes
      (.csv.gz) from release 2026-09-26. Counted rows and listed all 30 AI Act votes with tallies.
      A linked amendment PDF (A-9-2023-0048-AM-189-189_en.pdf) downloaded with HTTP 200 after
      a redirect.
    caveats: 'Roll-call votes only: amendments decided by show of hands or by electronic vote
      without roll call are missing. Use the EP Results-of-votes XML for those. Descriptions
      are in French. Before 2024 there is no result or author field. ''Vote en bloc'' rows cover
      hundreds of committee amendments at once. A block with a majority of ''for'' votes is
      not proof that a split or qualified-majority vote passed.'
  - id: hys-feedback-api
    name: Have Your Say (Better Regulation portal) feedback API (groupInitiatives, allFeedback,
      download)
    url: https://ec.europa.eu/info/law/better-regulation/brpapi/groupInitiatives/12527
    provider: European Commission
    year: 2026
    kind: api
    access: api
    licence: unknown (Commission reuse policy not checked here)
    scope: 'Feedback on the adopted proposal: AI Act initiative 12527, publication 14488, 304
      items (2021-04-26 to 2021-08-06). DSA 12417/13971, 138 items. DMA 12418/13970, 90 items.
      Data Act 13045/15717, 163 items. Roadmap or inception impact assessment feedback: AI 133,
      DSA 110, DMA 85, Data Act 91. GDPR (2012) is not on the portal under these searches.'
    contents: 'allFeedback returns id, organization, userType, country, companySize, language,
      dateFeedback, feedback text, publicationId and attachments (documentId, file name, size).
      Attachments download from /api/download/<documentId>. Publication records also list Commission
      documents: proposal, annexes, impact assessment parts 1-2, executive summary and the Regulatory
      Scrutiny Board opinion.'
    labels: none
    steps: [match, heard, graph]
    fit: high
    fit_reason: Gives organization-level text and position papers to match against amendments
      and final text, for all four post-2020 laws.
    status: verified
    checked: '2026-10-02'
    evidence: Fetched groupInitiatives 12527, 12417, 12418 and 13045, and allFeedback for 14488
      (totalElements 304), 13971 (138), 13970 (90) and 15717 (163). Downloaded attachment 090166e5e1cd1796
      (Equinet, PDF, 7 pages).
    caveats: Feedback is 'heard' evidence, not proof of uptake. A Transparency Register number
      is not in allFeedback (it is in the OPC CSV). The attachment size in the listing did not
      match the downloaded size (80,083 vs 654,526 bytes).
  - id: integritywatch-mep-meetings
    name: Integrity Watch EU, MEP meetings with interest representatives (JSON behind integritywatch.eu/mepmeetings)
    url: https://www.integritywatch.eu/data/mepmeetings/legislature_9/mepmeetings.json
    provider: Transparency International EU (Integrity Watch EU)
    year: 2025
    kind: dataset
    access: download
    licence: unknown
    scope: 'Meetings declared by MEPs on EP pages. legislature_9 file: 64,151 meetings from
      2019-06-07 to 2024-06-04. legislature_10 file: 61,262 meetings dated 2019-07-02 to 2025-04-29.'
    contents: 'Fields: mep, epid (EP MEP id), group, country, role (Member, Rapporteur 8,448,
      Shadow rapporteur 9,575, Committee chair), date, title (meeting subject), lobbyists and
      lobbyistsArray, location, committees, dossier. A separate mepmeetings_lobbysts_tr_match.json
      maps 40,844 lobbyist name strings to Transparency Register ids (many empty).'
    labels: none
    steps: [graph, heard, match]
    fit: high
    fit_reason: Direct organization-MEP edges with rapporteur or shadow roles. 523 legislature_9
      meeting titles mention artificial intelligence, so a meeting can be joined to amendment
      authors through epid.
    status: verified
    checked: '2026-10-02'
    evidence: Found the paths in static/mepmeetings.js. Downloaded both JSON files (32.5 MB
      and 31.3 MB) and the TR-match file (1.8 MB), then counted records, roles and the date
      range.
    caveats: The dossier field is empty in all records, so linking to a procedure needs text
      matching on title or committee. Org names are free text. The data looks last updated around
      April 2025. Undocumented endpoint with no stated licence. EP-side declarations are only
      mandatory for rapporteurs, shadows and chairs.
  - id: commission-ia-synopsis-reports
    name: Commission impact assessments, including the stakeholder consultation synopsis annex
    url: https://ec.europa.eu/info/law/better-regulation/api/download/090166e5dc33a54a
    provider: European Commission
    year: 2021
    kind: corpus
    access: download
    licence: unknown
    scope: AI Act IA SWD(2021) parts 1-2 (3.29 MB and 1.43 MB). DSA IA parts 1-2. DMA and Data
      Act equivalents are on their publication records.
    contents: Impact assessment PDFs. The synopsis of stakeholder consultation is normally Annex
      2. The RSB opinion and executive summary are separate files.
    labels: Commission's own summary of who argued what (proposal-stage uptake narrative)
    steps: [heard, match]
    fit: medium
    fit_reason: Official mapping of consultation inputs to policy options. Useful to label 'heard'
      and the stance of stakeholder categories.
    status: reported
    checked: '2026-10-02'
    evidence: Attachment ids and titles seen in groupInitiatives 12527 and 12417 JSON. The PDFs
      were not opened, so the presence of the synopsis annex was not confirmed.
    caveats: Not organization-level and not linked to final-law text.
  - id: ep-committee-rollcall-results-pdf
    name: EP committee "Results of roll-call votes" PDFs (committee Votes pages, 9th-term archive
      and current)
    url: https://www.europarl.europa.eu/committees/en/archives/9/imco/votes
    provider: European Parliament committee secretariats
    year: 2026
    kind: dataset
    access: scrape
    licence: unknown
    scope: 'IMCO votes pages: 9th-term archive from 2019-01 to 2024, and the current page from
      2024-09 to 2026-09. Other committees have the same page pattern (for example the EMPL
      file seen on the IMCO page). Sessions from 2021 split into ''Final vote'' and ''Amendments
      vote'' PDFs.'
    contents: Per-vote roll calls with MEP names grouped by political group and +/-/0 totals.
      The DSA IMCO amendments file for 13-14 Dec 2021 (22 pages) has at least 30 roll calls
      on compromise amendments CA 1-16 and CA A-H, on opinion-committee amendments LIBE 94,
      LIBE 101, LIBE 147, JURI 281 and ITRE 222, and on individual amendments 1464, 1806 and
      1810. The AI Act IMCO-LIBE file for 11 May 2023 (3 pages) has only the final vote (+83).
      The current-term page also publishes 'Voting lists' (for example 'Final VL_...pdf').
    labels: committee vote outcome per compromise or amendment (roll-call items only) with per-MEP
      votes
    steps: [passed, graph]
    fit: medium
    fit_reason: The only official committee-stage amendment vote results found. They show which
      compromise amendments passed and who voted for them for the DSA, but not for the AI Act,
      whose committee vote was published as a final vote only.
    status: verified
    checked: '2026-10-02'
    evidence: Listed the index with WebFetch. curl gets HTTP 202 (bot challenge) and WebFetch
      on a PDF gets 403. Inside the in-app browser on europarl.europa.eu, fetched /telastatic/cmsdata/243660/IMCO
      Voting Session 13-14 December 2021 (amendments)_rollcall.htm.pdf and /telastatic/cmsdata/269933/RCV
      IMCO-LIBE 11.05.23.pdf, then extracted the text with pdf.js.
    caveats: These are PDFs, and scripted fetches are blocked, so a real browser session is
      needed. Most amendments fall without a roll call when a compromise amendment is adopted,
      so voting lists or the committee report text are needed to label every amendment. Nothing
      was found for GDPR LIBE 2013 (the 7th-term archive was not checked).
  - id: ep-committee-voting-lists
    name: EP committee voting lists (Final VL) on committee Votes pages
    url: https://www.europarl.europa.eu/committees/en/imco/meetings/votes
    provider: European Parliament committee secretariats
    year: 2026
    kind: dataset
    access: scrape
    licence: unknown
    scope: Current term (from 2024-09). There is a 'Voting list' section in the 9th-term archive,
      but no DSA or AI Act voting list was identified there.
    contents: 'Voting lists show which compromise amendment replaces which numbered amendments,
      and which amendments fall. Example: ''Final VL_Chemical Omnibus VI_Provisional agreement.pdf''.'
    labels: mapping from amendment to compromise amendment (which tabled amendments fall when
      a CA passes)
    steps: [passed, match]
    fit: medium
    fit_reason: Needed to turn compromise-amendment outcomes into outcomes for individual tabled
      amendments. Mostly available only for recent files.
    status: reported
    checked: '2026-10-02'
    evidence: Link titles and URLs seen through WebFetch of the IMCO votes page. No voting-list
      PDF was opened.
    caveats: Probably not available for the AI Act, DSA, DMA, Data Act or GDPR committee votes.
      Not verified.
  - id: ep-opendata-api-plenary-decisions
    name: EP Open Data Portal API v2, plenary roll-call decisions (meetings/{id}/decisions and
      vote-results)
    url: https://data.europarl.europa.eu/api/v2/meetings/MTG-PL-2023-06-14/decisions?format=application%2Fld%2Bjson
    provider: European Parliament (Open Data Portal)
    year: 2026
    kind: api
    access: api
    licence: unknown
    scope: Plenary sittings. The 2023-06-14 sitting was tested.
    contents: 'One record per roll-call vote. Fields: activity_label (for example ''... A9-0188/2023
      ... Article 5, § 1, après le point d - Am 772''), decision_method (VOTE_ELECTRONIC_ROLLCALL),
      number_of_votes_favor/against/abstention, had_voter_favor/against/abstention (MEP person
      ids), had_voter_intended_* (vote corrections) and notation_votingId. The test sitting
      returned 58 decisions, 29 of them on the AI Act. The vote-results endpoint links each
      item to its report (A-9-2023-0188) and procedure.'
    labels: plenary roll-call outcome with per-MEP votes (official source for HowTheyVote and
      Parltrack)
    steps: [passed, graph]
    fit: medium
    fit_reason: Official and machine-readable, but HowTheyVote already packages the same data.
      Useful for checking HowTheyVote or for MEP vote corrections.
    status: verified
    checked: '2026-10-02'
    evidence: Fetched decisions for MTG-PL-2023-06-14 (728 KB JSON-LD) and vote-results. Listed
      all 29 AI Act roll-call decisions, whose tallies match HowTheyVote.
    caveats: Roll-call votes only. Pagination appeared to have no effect (offset 58 returned
      the same 58 records). The amendment number has to be parsed from the label.
  - id: ep-opendata-api-procedures
    name: EP Open Data Portal API v2, procedures, adopted texts and provisional agreements
    url: https://data.europarl.europa.eu/api/v2/procedures/2021-0106?format=application%2Fld%2Bjson
    provider: European Parliament (Open Data Portal)
    year: 2026
    kind: api
    access: api
    licence: unknown
    scope: All EP procedures. AI Act 2021/0106 was tested. Related endpoints are adopted-texts,
      plenary-documents, committee-documents and plenary-session-documents.
    contents: 'Procedure events with typed activities: COMMITTEE_ADOPTING_REPORT (2023-05-11),
      PLENARY_AMEND (2023-06-14 -> TA-9-2023-0236), PLENARY_REFER_COMMITTEE_INTERINSTITUTIONAL_NEGOTIATIONS,
      COMMITTEE_APPROVE_PROVISIONAL_AGREEMENT (2024-02-13 -> CJ40-AG-758862), PLENARY_AMEND_PROPOSAL
      (2024-03-13 -> TA-9-2024-0138), SIGNATURE and PUBLICATION_OFFICIAL_JOURNAL. Committee
      opinions are linked too. committee-documents uses only 5 work types: draft report, opinion,
      draft opinion, opinion letter and AGREEMENT_PROVISIONAL. The provisional agreement CJ40-AG-758862
      (2024-02-02) is downloadable as PDF and DOCX.'
    labels: procedure stage timeline; links from report to adopted text to provisional agreement
    steps: [match, won, graph]
    fit: medium
    fit_reason: Joins the documents of each stage (report A9, text adopted TA, provisional agreement
      AG and final act) for every target law without scraping OEIL.
    status: verified
    checked: '2026-10-02'
    evidence: Fetched procedures/2021-0106 (23 KB) and committee-documents/CJ40-AG-758862 metadata,
      and sampled 3,155 committee-documents and adopted-texts.
    caveats: Committee amendment documents (AM) and committee vote results are not exposed through
      committee-documents. List endpoints need specific parameters (plenary-session-documents?year=
      returned 400). There is no OpenAPI file at /api/v2/openapi.json.
  - id: ep-provisional-agreement-texts
    name: EP provisional agreement texts (AGREEMENT_PROVISIONAL committee documents)
    url: https://data.europarl.europa.eu/api/v2/committee-documents/CJ40-AG-758862?format=application%2Fld%2Bjson
    provider: European Parliament (Open Data Portal)
    year: 2026
    kind: api
    access: api
    licence: unknown
    scope: 'Trilogue outcomes voted in committee. 177 AGREEMENT_PROVISIONAL documents were in
      the sampled list. AI Act: CJ40-AG-758862 (2024-02-02).'
    contents: Provisional agreement text in PDF and DOCX (AI Act about 227 KB as listed). Titles
      look like 'PROVISIONAL AGREEMENT RESULTING FROM INTERINSTITUTIONAL NEGOTIATIONS ... 2021/0106(COD)'.
    labels: compromise (trilogue) text
    steps: [won]
    fit: medium
    fit_reason: Official compromise text before lawyer-linguist revision. Useful when the four-column
      trilogue table is not available.
    status: verified
    checked: '2026-10-02'
    evidence: Fetched the metadata record with its EN PDF and DOCX distribution paths. The file
      itself was not downloaded.
    caveats: Not a column-by-column comparison. The text is close to the final act, so CELLAR
      final acts may be enough.
  - id: hys-opc-bulk-contributions
    name: Have Your Say public consultation (OPC) bulk exports (contributions CSV and attachments
      ZIP)
    url: https://ec.europa.eu/info/law/better-regulation/api/download/local-7639546-contributions
    provider: European Commission
    year: 2020
    kind: dataset
    access: download
    licence: unknown
    scope: OPC on the AI White Paper (publication 25429, 1,216 replies, 2020-02-20 to 2020-06-14).
      The DSA/DMA OPC (13127 and 25545, 2,863 replies) lists contributions-Digital_Services_Act.zip
      (9.0 MB) and an attachments ZIP (114.7 MB). The Data Act OPC (14627) has 449 replies.
      The AI attachments ZIP is 132.7 MB.
    contents: 'contributions-AIConsult2020.csv (cp1252, '';''-separated): 1,216 rows x 73 columns.
      Columns: Reference, Feedback date, Language, User type, Organisation name, Transparency
      register number, Organisation size, Country, and Likert or free-text answers on the six
      White Paper actions and regulatory options.'
    labels: none (stated preferences; the Likert answers can serve as stance labels)
    steps: [heard, match, predict]
    fit: medium
    fit_reason: Structured stances with Transparency Register ids. They join to lobby-meeting
      graphs and LobbyFacts. Fit is medium because they predate the proposal.
    status: verified
    checked: '2026-10-02'
    evidence: 'Downloaded the AI contributions ZIP (772,527 bytes) and parsed the CSV: 1,216
      rows and 73 columns. The DSA and attachments ZIPs were seen only in groupInitiatives metadata.'
    caveats: The 100+ MB attachment ZIPs were not downloaded. The CSV needs cp1252 decoding
      and multi-line field handling. User type is empty in 460 rows of the naive parse.
  - id: integritywatch-commission-meetings
    name: Integrity Watch EU, Commission meetings with interest representatives
    url: https://www.integritywatch.eu/data/ecmeetings/ecmeetings_vonderleyen1.json
    provider: Transparency International EU (Integrity Watch EU)
    year: 2025
    kind: dataset
    access: download
    licence: unknown
    scope: 'Commissioners, cabinets and DGs. Von der Leyen I: 26,174 meetings from 2019-12-02
