  - id: war-of-words-2-ep-amendments
    name: 'War of Words II: EP committee amendment edits with adoption labels (EP7, EP8)'
    url: https://zenodo.org/record/4525015
    provider: Kristof, Suresh, Grossglauser, Thiran (EPFL INDY lab); code at https://github.com/indy-lab/war-of-words-2
    year: 2021
    kind: dataset
    access: download
    licence: CC BY 4.0
    scope: European Parliament committees, 7th and 8th terms (2009-2019); all ordinary-procedure
      reports and opinions that had amendments tabled
    contents: JSON-lines files war-of-words-2-ep7.txt (449 MB) and war-of-words-2-ep8.txt (607
      MB). Each line is a 'conflict' (one or more competing edits to the same article). Each
      edit has edit_id, edit_type (insert/delete/replace), accepted (bool), dossier_ref, dossier_type
      (report/opinion), vote date, legal_act, committee, outsider flag, article_type, source
      amendment document (COMM-AM(YEAR)PENUMBER), justification text, tokenised text_original
      and text_amended plus diff indices, and authors (MEP id, name, gender, nationality, political
      group, rapporteur flag). Paper reports 449,493 edits from 237,177 amendments; Suresh et
      al. 2023 cite 104,996 EP8 amendments on 347 laws. A 3 MB sample of EP8 held 325 conflicts
      / 960 edits / 135 accepted.
    labels: amendment (edit) adopted or rejected in the committee vote; at most one accepted
      edit per conflict
    steps: [passed, graph, match, predict]
    fit: high
    fit_reason: Only open, labelled dataset found of MEP amendments as old-text/new-text pairs
      with whether they passed in committee, linked to MEP ids and groups. Directly usable to
      train or calibrate a 'passed' model and as a large pool of realistic amendment texts (negatives/decoys)
      for matching.
    status: verified
    checked: '2026-10-02'
    evidence: Opened Zenodo record API (files, licence, schema); range-downloaded first 3 MB
      of EP8 file and parsed records (fields, labels, diff indices, MEP metadata).
    caveats: Ends in 2019 (no AI Act, DSA, 2024+ files). Committee stage only, not plenary or
      final law. Text is lower-cased and tokenised. Files are large (0.45-0.6 GB each). No lobby
      link. Raw v1 (Zenodo 3757714) has labels but no text.
