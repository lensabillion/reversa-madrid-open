$schema: https://json-schema.org/draft/2020-12/schema
title: PriorWorkCatalog
description: >-
  Published work relevant to the Reversa Madrid Open challenges: papers, datasets,
  tools, products and data journalism. Consumers: the research brief and the pitch.
type: object
required:
  - updated
  - works
properties:
  updated:
    type: string
    pattern: '^\d{4}-\d{2}-\d{2}$'
  works:
    type: array
    items:
      $ref: '#/$defs/Work'
$defs:
  Work:
    type: object
    required:
      - id
      - title
      - year
      - kind
      - challenges
      - url
      - finding
      - relevance
    properties:
      id:
        type: string
        pattern: '^[a-z0-9]+(-[a-z0-9]+)*$'
      title:
        type: string
      authors:
        type: string
      year:
        type: integer
        minimum: 1950
        maximum: 2030
      venue:
        type: string
      kind:
        type: string
        enum:
          - paper
          - dataset
          - tool
          - product
          - journalism
          - method
      challenges:
        type: array
        minItems: 1
        items:
          type: string
          enum:
            - open-track
            - c01-law-markets
            - c02-bill-to-law
            - c03-influence-graph
      url:
        type: string
        pattern: '^https?://'
      finding:
        description: The result or contribution, with numbers where available.
        type: string
      relevance:
        description: What to borrow, or what to avoid, for the hackathon.
        type: string
      confidence:
        description: >-
          read = full text or abstract read in this research; cited = known from a
          secondary source or citation only.
        type: string
        enum:
          - read
          - cited
