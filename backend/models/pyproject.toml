[project]
name = "influence-embedding-evaluation"
version = "0.1.0"
requires-python = ">=3.14,<3.15"
dependencies = [
  "huggingface-hub==1.32.0",
  "numpy==2.5.3",
  "safetensors==0.8.0",
  "torch==2.14.0",
  "transformers==5.17.0",
]

[tool.uv]
package = false
exclude-newer = "14 days"
no-build = true

[dependency-groups]
dev = ["pytest==9.1.1"]

[tool.pytest]
testpaths = ["tests"]
pythonpath = ["."]

[tool.basedpyright]
include = ["*.py", "tests"]
typeCheckingMode = "strict"
failOnWarnings = true
# Preparation runs in the main environment; inference runs in this one. Both are locked.
extraPaths = ["../src", "../.venv/lib/python3.14/site-packages"]
